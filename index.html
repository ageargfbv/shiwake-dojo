<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>仕訳道場</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d2a44">
<style>
:root{
  --bg:#e9e2d0;--paper:#fbf7ec;--paper2:#f3ecda;--ink:#1d2a44;--sub:#6b7286;--rule:#8db5a3;--rule2:#cfdcd2;
  --shu:#c8372d;--ai:#2c5f8a;--kin:#b0822a;--key:#fffdf6;--keyb:#d9cfb6;--shadow:rgba(40,30,10,.18);
  --pl:max(.7rem,env(safe-area-inset-left));--pr:max(.7rem,env(safe-area-inset-right));
  --pt:max(.45rem,env(safe-area-inset-top));--pb:max(.45rem,calc(env(safe-area-inset-bottom) - .5rem));
  --min:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1524;--paper:#1a2336;--paper2:#141c2d;--ink:#ece5d2;--sub:#98a0b4;--rule:#4f7868;--rule2:#2c3d44;
  --shu:#e8604f;--ai:#7fb4de;--kin:#d6ab57;--key:#243049;--keyb:#35435f;--shadow:rgba(0,0,0,.45);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:min(4.1vmin,2.05vmax);-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;width:100%;overflow:hidden;position:fixed;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#stage{position:fixed;left:0;top:0;width:var(--W,100vw);height:var(--H,100vh);padding:var(--pt) var(--pr) var(--pb) var(--pl);
  background:radial-gradient(120% 140% at 0 0,var(--paper2),var(--bg))}
/* 縦持ちは90度回して描く。stage の左＝画面の上（時計の帯）なので、そこは帯の高さ以上あける（iPhone は帯の下をぼかす） */
@media (orientation:portrait){
  :root{--pl:max(3.9rem,calc(env(safe-area-inset-top) + .5rem));--pr:max(.7rem,calc(env(safe-area-inset-bottom) + .2rem));--pt:.45rem;--pb:.45rem}
  #stage{width:var(--H,100vh);height:var(--W,100vw);transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
}
.scr{width:100%;height:100%;display:flex;gap:.7rem}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- ホーム ---------- */
#home .side{width:13.5rem;display:flex;gap:.7rem;flex:none}
.daiji{writing-mode:vertical-rl;font-family:var(--min);font-weight:700;font-size:3.1rem;letter-spacing:.16em;line-height:1;
  padding:.5rem .1rem;position:relative;display:flex;align-items:center;gap:.5rem}
.daiji i{font-style:normal;font-size:.8rem;letter-spacing:.05em;color:#fff;background:var(--shu);padding:.4rem .22rem;border-radius:.2rem;
  box-shadow:inset 0 0 0 .08rem rgba(255,255,255,.55);transform:rotate(-4deg)}
.stat{flex:1;display:flex;flex-direction:column;gap:.45rem;min-width:0}
.tile{background:var(--paper);border-radius:.55rem;padding:.45rem .6rem;box-shadow:0 .1rem .35rem var(--shadow);border-left:.22rem solid var(--rule)}
.tile small{display:block;font-size:.6rem;color:var(--sub);letter-spacing:.08em}
.tile b{font-family:var(--min);font-size:1.45rem;line-height:1.15}
.tile b span{font-size:.7rem;font-weight:400;color:var(--sub);margin-left:.15rem}
.go{margin-top:auto;display:flex;flex-direction:column;gap:.4rem}
.btn{height:2.5rem;border-radius:.6rem;font-weight:700;font-size:.9rem;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:.4rem;
  background:var(--ink);color:var(--paper);box-shadow:0 .16rem 0 rgba(0,0,0,.28);transition:transform .08s}
.btn:active{transform:translateY(.12rem);box-shadow:none}
.btn.shu{background:var(--shu);color:#fff}
.btn.line{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 .08rem var(--keyb),0 .16rem 0 var(--keyb)}
.btn:disabled{opacity:.35}
.btn em{font-style:normal;font-weight:400;font-size:.7rem;opacity:.8}
#home .cats{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:.6rem;min-width:0}
.cat{position:relative;background:var(--paper);border-radius:.6rem;padding:.6rem .6rem .55rem .95rem;text-align:left;display:flex;flex-direction:column;
  box-shadow:0 .12rem .4rem var(--shadow);overflow:hidden;transition:transform .08s}
.cat:active{transform:scale(.96)}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.42rem;background:var(--c)}
.cat::after{content:"";position:absolute;left:.42rem;right:0;top:0;bottom:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 1.25rem,var(--rule2) 1.25rem 1.3rem);opacity:.55}
.cat h3{margin:0;font-family:var(--min);font-size:1.02rem;line-height:1.3;word-break:keep-all;position:relative;z-index:1}
.cat .due{position:absolute;right:.45rem;bottom:.85rem;z-index:1;font-size:.62rem;font-weight:700;color:#fff;background:var(--shu);border-radius:.6rem;padding:.08rem .45rem}
.cat .n{margin-top:auto;font-size:.68rem;color:var(--sub);position:relative;z-index:1}
.cat .n b{font-size:1.25rem;color:var(--ink);font-family:var(--min)}
.bar{height:.3rem;border-radius:.2rem;background:var(--rule2);margin-top:.25rem;position:relative;z-index:1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:.2rem}
.cat .sumi{position:absolute;right:.45rem;top:.4rem;z-index:1;width:1.7rem;height:1.7rem;border-radius:50%;border:.12rem solid var(--shu);color:var(--shu);
  font-family:var(--min);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
#snd{position:absolute;left:calc(var(--pl) + .5rem);bottom:var(--pb);width:2rem;height:2rem;border-radius:50%;font-size:.95rem;color:var(--sub)}

/* ---------- 出題 ---------- */
#play{flex-direction:column;gap:.35rem}
.top{height:1.7rem;flex:none;display:flex;align-items:center;gap:.6rem}
.back{width:1.9rem;height:1.7rem;border-radius:.45rem;background:var(--paper);box-shadow:0 .08rem .25rem var(--shadow);font-size:1rem;line-height:1}
.top .cn{font-family:var(--min);font-weight:700;font-size:.9rem}
.dots{display:flex;gap:.28rem;flex:1;align-items:center}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--rule2)}
.dots i.cur{background:var(--ink);transform:scale(1.25)}
.dots i.ok{background:var(--shu)}
.dots i.ng{background:var(--ai)}
.top .tm{font-size:.85rem;color:var(--sub);min-width:2.6rem;text-align:right}
.body{flex:1;display:flex;gap:.6rem;min-height:0}
.main{flex:1;display:flex;flex-direction:column;gap:.4rem;min-width:0}
.qbox{flex:1;min-height:0;position:relative;background:var(--paper);border-radius:.55rem;box-shadow:0 .1rem .35rem var(--shadow)}
.qin{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.5rem .75rem;font-size:.86rem;line-height:1.62}
.qin .no{font-family:var(--min);font-weight:700;color:var(--shu);margin-right:.4rem}
.flip{position:absolute;right:.35rem;bottom:.3rem;height:1.45rem;padding:0 .6rem;border-radius:.75rem;font-size:.66rem;font-weight:700;
  background:var(--ink);color:var(--paper);opacity:.92}
.ex table{border-collapse:collapse;margin:.1rem 0 .35rem;font-size:.8rem}
.ex td{padding:.08rem .5rem;border-bottom:.06rem solid var(--rule2)}
.ex td.v{text-align:right}
.ex td.m{border-left:.14rem double var(--shu)}
.ex h4{margin:0 0 .1rem;font-family:var(--min);font-size:.85rem;color:var(--shu)}
.ex p{margin:0;font-size:.8rem;line-height:1.6}

.jr{flex:none;display:grid;grid-template-columns:1.6fr 1fr 1.6fr 1fr;grid-auto-rows:2.15rem;background:var(--paper);border-radius:.55rem;
  box-shadow:0 .1rem .35rem var(--shadow);overflow:hidden;border:.08rem solid var(--rule)}
.jh{grid-column:span 2;height:1.25rem;align-self:start;background:var(--rule);color:#fff;font-family:var(--min);font-weight:700;font-size:.74rem;
  display:flex;align-items:center;justify-content:center;letter-spacing:.5em;text-indent:.5em}
@media (prefers-color-scheme:dark){.jh{color:var(--ink)}}
.jr{grid-template-rows:1.25rem repeat(4,2.15rem) 1.25rem}
.c{position:relative;border-top:.06rem solid var(--rule);border-left:.06rem solid var(--rule2);font-size:.8rem;display:flex;align-items:center;
  padding:0 .4rem;min-width:0;line-height:1.15;text-align:left}
.c.a{border-left:0}
.c.k.a{border-left:.16rem double var(--shu)}
.c.v{justify-content:flex-end;font-size:.86rem}
.c.long{font-size:.66rem}
.c.act{background:color-mix(in srgb,var(--kin) 22%,transparent);box-shadow:inset 0 0 0 .12rem var(--kin);z-index:1}
.c.act:empty::after{content:"";width:.08rem;height:1.1rem;background:var(--kin);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.c.ok::before,.c.ng::before{position:absolute;right:.25rem;top:50%;transform:translateY(-50%);font-weight:700;font-size:1.05rem;font-family:var(--min)}
.c.ok::before{content:"○";color:var(--shu)}
.c.ng::before{content:"×";color:var(--ai)}
.c.ng{background:color-mix(in srgb,var(--ai) 12%,transparent)}
.jt{grid-column:span 2;border-top:.06rem solid var(--rule);font-size:.68rem;color:var(--sub);display:flex;align-items:center;justify-content:space-between;padding:0 .45rem}
.jt.k{border-left:.16rem double var(--shu)}
.jt b{font-size:.8rem;color:var(--ink)}
.jr.bal .jt b{color:var(--shu)}

.panel{width:13.4rem;flex:none;display:flex;flex-direction:column;gap:.4rem;min-height:0}
.pv{flex:1;min-height:0;display:flex;flex-direction:column;gap:.3rem}
.chips{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(2.15rem,1fr);gap:.3rem;overflow-y:auto}
.chip{background:var(--key);border-radius:.45rem;box-shadow:inset 0 0 0 .07rem var(--keyb),0 .12rem 0 var(--keyb);font-size:.72rem;font-weight:600;line-height:1.2;
  padding:.1rem .3rem;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-all}
.chip.long{font-size:.6rem}
.chip:active,.key:active{transform:translateY(.1rem);box-shadow:inset 0 0 0 .07rem var(--keyb);background:color-mix(in srgb,var(--kin) 25%,var(--key))}
.chip.used{box-shadow:inset 0 0 0 .1rem var(--rule),0 .12rem 0 var(--rule)}
.del{flex:none;height:1.5rem;font-size:.66rem;color:var(--sub);border-radius:.4rem;box-shadow:inset 0 0 0 .07rem var(--keyb)}
.pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:.28rem}
.key{background:var(--key);border-radius:.45rem;box-shadow:inset 0 0 0 .07rem var(--keyb),0 .12rem 0 var(--keyb);font-size:1.1rem;font-weight:600}
.key.s{font-size:.82rem;color:var(--sub)}
.key.op{background:color-mix(in srgb,var(--ai) 13%,var(--key));color:var(--ai);font-size:1.25rem}
.key.eq{background:var(--ink);color:var(--paper);box-shadow:0 .12rem 0 rgba(0,0,0,.3);font-size:1.25rem}
#disp{flex:none;height:2.35rem;background:var(--paper);border-radius:.45rem;box-shadow:inset 0 0 0 .07rem var(--keyb);padding:.15rem .5rem;
  display:flex;flex-direction:column;justify-content:center;overflow:hidden;line-height:1.2}
#disp div{display:flex;justify-content:flex-end;white-space:nowrap;overflow:hidden}
#dE{font-size:.7rem;color:var(--sub);min-height:.84rem}
#dR{font-size:1.05rem;font-weight:700}
.c.v{overflow:hidden;white-space:nowrap}
.c.v.ex{font-size:.66rem;color:var(--sub)}
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem}
.han{width:6.4rem;height:6.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--min);font-weight:700;font-size:2rem;
  letter-spacing:.08em;color:var(--shu);border:.22rem solid var(--shu);box-shadow:inset 0 0 0 .14rem var(--paper),inset 0 0 0 .22rem var(--shu);
  transform:rotate(-10deg);animation:pon .32s cubic-bezier(.2,1.6,.4,1) both}
.han.ng{color:var(--ai);border-color:var(--ai);box-shadow:inset 0 0 0 .14rem var(--paper),inset 0 0 0 .22rem var(--ai);font-size:1.45rem;animation:bure .35s both}
@keyframes pon{0%{transform:rotate(-10deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:rotate(-10deg) scale(1)}}
@keyframes bure{0%,100%{transform:rotate(-6deg)}25%{transform:rotate(-6deg) translateX(-.4rem)}75%{transform:rotate(-6deg) translateX(.4rem)}}
.res .sec{font-size:.75rem;color:var(--sub)}
.combo{font-family:var(--min);font-weight:700;color:var(--kin);font-size:.95rem}
.panel>.btn{flex:none}

/* ---------- 結果 ---------- */
#result .sum{width:14rem;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;background:var(--paper);
  border-radius:.7rem;box-shadow:0 .12rem .4rem var(--shadow);padding:.6rem}
#result .dan{font-family:var(--min);font-weight:700;font-size:1.5rem;color:var(--shu);border:.16rem solid var(--shu);padding:.2rem .7rem;border-radius:.3rem;
  transform:rotate(-4deg);animation:pon2 .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pon2{0%{transform:rotate(-4deg) scale(2);opacity:0}100%{transform:rotate(-4deg) scale(1)}}
#result .sc{font-family:var(--min);font-size:3.4rem;font-weight:700;line-height:1}
#result .sc span{font-size:1.2rem;color:var(--sub)}
#result .right{flex:1;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border-radius:.6rem;box-shadow:0 .1rem .35rem var(--shadow)}
.li{display:flex;align-items:center;gap:.6rem;padding:.42rem .8rem;border-bottom:.06rem solid var(--rule2);font-size:.82rem}
.li b{font-family:var(--min);font-size:1.05rem;width:1.2rem;text-align:center}
.li b.ok{color:var(--shu)}.li b.ng{color:var(--ai)}
.li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{color:var(--sub)}
.row{display:flex;gap:.5rem}.row .btn{flex:1}
.go .row{gap:.35rem}.go .row .btn{min-width:0;padding:0 .2rem;gap:.25rem}

/* ---------- ○×の履歴 ---------- */
.mk{font-family:var(--min);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.mk u{text-decoration:none}.mk .o{color:var(--shu)}.mk .x{color:var(--ai)}.mk .none{color:var(--sub);font-weight:400}
.qin .mk{float:right;margin:0 0 .1rem .6rem;font-size:.82rem}

/* ---------- 問題一覧 ---------- */
#list{gap:.6rem}
.lcats{width:8rem;flex:none;display:flex;flex-direction:column;gap:.22rem}
.lc{flex:1;min-height:0;border-radius:.4rem;background:var(--paper);font-size:.72rem;font-weight:600;text-align:left;padding:0 .5rem;
  border-left:.3rem solid var(--c,var(--ink));box-shadow:0 .06rem .2rem var(--shadow);white-space:nowrap;overflow:hidden}
.lc.on{background:var(--ink);color:var(--paper)}
.lr{flex:1;display:flex;flex-direction:column;gap:.4rem;min-width:0}
.ltop{flex:none;height:1.9rem;display:flex;align-items:center;gap:.5rem}
.ltop .cn{font-family:var(--min);font-weight:700;font-size:.95rem;white-space:nowrap}
.seg{display:flex;background:var(--paper);border-radius:.5rem;box-shadow:inset 0 0 0 .07rem var(--keyb);overflow:hidden;flex:none}
.seg button{padding:0 .6rem;height:1.7rem;font-size:.72rem;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--paper)}
.sortb{margin-left:auto;height:1.7rem;padding:0 .6rem;font-size:.7rem;font-weight:600;border-radius:.5rem;background:var(--paper);
  box-shadow:inset 0 0 0 .07rem var(--keyb);white-space:nowrap;flex:none}
#lList .li{width:100%;text-align:left}
#lList .li small{flex:none;width:5.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lList .li .mk{flex:none;font-size:.85rem}
.lfoot{flex:none;display:flex;align-items:center;gap:.6rem}
.lfoot span{flex:1;font-size:.75rem;color:var(--sub)}
.lfoot .btn{width:13rem}
.lempty{padding:1.2rem;text-align:center;color:var(--sub);font-size:.8rem}
.tile small em{font-style:normal;float:right;color:var(--ink);font-weight:700;letter-spacing:0}
</style>
</head>
<body>
<div id="stage">

<section class="scr" id="home">
  <div class="side">
    <div class="daiji">仕訳道場<i>一級</i></div>
    <div class="stat">
      <div class="tile"><small>今日<em class="num" id="sMin"></em></small><b class="num" id="sToday"></b></div>
      <div class="tile"><small>正答率</small><b class="num" id="sRate"></b></div>
      <div class="tile"><small>習得</small><b class="num" id="sDone"></b></div>
      <div class="go">
        <button class="btn shu" id="bDue">今日の復習 <em id="nDue"></em></button>
        <button class="btn" id="bRand">おまかせ10問</button>
        <div class="row"><button class="btn line" id="bWeak">苦手<em id="nWeak"></em></button><button class="btn line" id="bList">一覧</button></div>
      </div>
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <button id="snd" aria-label="音"></button>
</section>

<section class="scr" id="play" hidden>
  <div class="top">
    <button class="back" id="bBack" aria-label="戻る">‹</button>
    <span class="cn" id="pCat"></span>
    <div class="dots" id="dots"></div>
    <span class="tm num" id="pTime"></span>
  </div>
  <div class="body">
    <div class="main">
      <div class="qbox"><div class="qin" id="qin"></div><button class="flip" id="bFlip" hidden></button></div>
      <div class="jr" id="jr"></div>
    </div>
    <div class="panel">
      <div class="pv" id="pvChips"><div class="chips" id="chips"></div><button class="del" id="bDel">この行を消す</button></div>
      <div class="pv" id="pvPad" hidden><div id="disp"><div id="dE"></div><div id="dR" class="num"></div></div><div class="pad" id="pad"></div></div>
      <div class="pv" id="pvRes" hidden><div class="res" id="res"></div></div>
      <button class="btn shu" id="bCheck">答え合わせ</button>
    </div>
  </div>
</section>

<section class="scr" id="result" hidden>
  <div class="sum">
    <div class="dan" id="rDan"></div>
    <div class="sc num" id="rSc"></div>
    <div class="sec num" id="rTime" style="font-size:.8rem;color:var(--sub)"></div>
  </div>
  <div class="right">
    <div class="list" id="rList"></div>
    <div class="row">
      <button class="btn line" id="bHome">道場へ戻る</button>
      <button class="btn shu" id="bRetry">まちがいをもう一度</button>
    </div>
  </div>
</section>

<section class="scr" id="list" hidden>
  <div class="lcats" id="lCats"></div>
  <div class="lr">
    <div class="ltop">
      <button class="back" id="bLBack" aria-label="戻る">‹</button>
      <span class="cn">問題一覧</span>
      <div class="seg" id="lTabs"><button data-t="all">全部</button><button data-t="new">未回答</button><button data-t="ng">まちがい</button><button data-t="ok">正解</button></div>
      <button class="sortb" id="lSort"></button>
    </div>
    <div class="list" id="lList"></div>
    <div class="lfoot"><span class="num" id="lN"></span><button class="btn shu" id="bLGo"></button></div>
  </div>
</section>

</div>
<script src="questions.js"></script>
<script>
"use strict";
const KEY = "shiwake-dojo-v1";
const Q = window.QUESTIONS, CATS = window.CATS;
/* 分野の色は id で持つ（分野を足しても既存の色が変わらないように） */
const COLORS = { yuka: "#c8372d", kotei: "#2c5f8a", hikiate: "#b0822a", jun: "#3f8a6b", zei: "#7a4f9a", shueki: "#c96a2b", renketsu: "#2b7f8c", kogyo: "#5a6478", genkin: "#8a6d3b" };
const SPARE = ["#a04a6c", "#4d7a2a", "#3a5fa0"];
const ROWS = 4;
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("ja-JP");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const S = load();
S.h = S.h || {}; S.days = S.days || {}; S.sec = S.sec || {}; if (S.sound === undefined) S.sound = true;
S.list = S.list || { tab: "all", cat: "", sort: "cat" };

function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---- 音 ---- */
let AC = null;
function tone(f, d, when, type, g) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime + (when || 0), o = AC.createOscillator(), G = AC.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    G.gain.setValueAtTime(g || .07, t); G.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(G); G.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sTap = () => tone(880, .04, 0, "triangle", .035);
const sOk = () => { tone(784, .12, 0, "triangle", .08); tone(1175, .25, .1, "triangle", .08); };
const sNg = () => { tone(196, .25, 0, "sawtooth", .04); };

/* ---- 画面の切り替え ---- */
function show(id) { for (const s of ["home", "play", "result", "list"]) $(s).hidden = s !== id; }

/* ---- ○×の履歴：問題ごとに直近10回（h.hist＝"o"/"x" の並び）。hist の無い古い記録は最後の正誤1個だけ ---- */
function histOf(h) { return !h || !h.n ? "" : h.hist !== undefined ? h.hist : h.lastOk ? "o" : "x"; }
function marks(h) {
  const s = histOf(h);
  return '<span class="mk">' + (s ? [...s].map(c => '<u class="' + c + '">' + (c === "o" ? "○" : "×") + "</u>").join("") : '<u class="none">―</u>') + "</span>";
}

/* ---- 勉強時間：問題が出てから次へ進むまで（解説を読む間も含む）。1問5分で打ち切り。アプリを離れている間は数えない ---- */
const CAP = 300;
function addTime() {
  if (!P || !P.tShow) return;
  const s = Math.min(CAP, Math.round((Date.now() - P.tShow) / 1000));
  P.tShow = null;
  if (s > 0) { S.sec[today()] = (S.sec[today()] || 0) + s; save(); }
}
function fmtMin(s) { const m = Math.floor((s || 0) / 60); return m >= 60 ? Math.floor(m / 60) + "時間" + (m % 60) + "分" : m + "分"; }
document.addEventListener("visibilitychange", () => {
  if (!P || $("play").hidden) return;
  if (document.hidden) addTime(); else if (!P.tShow) P.tShow = Date.now();
});

/* ---- 復習の間隔：正解するたびに 1→3→7→14→30→60→120日。まちがえたら最初からで翌日。期日前の正解では進めない ---- */
const IV = [1, 3, 7, 14, 30, 60, 120];
function dayNum(t) { return Math.floor((t - new Date(t).getTimezoneOffset() * 60000) / 864e5); }   // 端末の暦の日付の通し番号
function migrate(h) {   // 復習の間隔を入れる前の記録（lv・due が無い）を引き継ぐ
  if (h && h.due === undefined && h.last) { h.lv = h.lastOk ? 1 : 0; h.due = dayNum(h.last) + 1; }
  return h;
}
function schedule(h, ok, now) {
  const td = dayNum(now);
  migrate(h);
  const wasDue = h.due === undefined || h.due <= td;
  if (!ok) { h.lv = 0; h.due = td + 1; }
  else if (wasDue) { h.lv = (h.lv || 0) + 1; h.due = td + IV[Math.min(h.lv, IV.length) - 1]; }
  return h;
}
function isDue(q) { const h = migrate(S.h[q.id]); return !!h && h.due <= dayNum(Date.now()); }
function dueList() {
  return Q.filter(isDue).map(q => ({ q, d: S.h[q.id].due, r: Math.random() })).sort((a, b) => a.d - b.d || a.r - b.r).map(x => x.q);
}

/* ---- ホーム ---- */
function isWeak(q) { const h = S.h[q.id]; return !!h && h.lastOk === false; }
function isDone(q) { const h = S.h[q.id]; return !!h && h.lastOk === true; }
function renderHome() {
  let n = 0, ok = 0;
  for (const k in S.h) { n += S.h[k].n || 0; ok += S.h[k].ok || 0; }
  $("sToday").innerHTML = (S.days[today()] || 0) + "<span>問</span>";
  $("sMin").textContent = fmtMin(S.sec[today()]);
  $("sRate").innerHTML = n ? Math.round(ok / n * 100) + "<span>％</span>" : "–";
  $("sDone").innerHTML = Q.filter(isDone).length + "<span>/ " + Q.length + "</span>";
  const weak = Q.filter(isWeak).length;
  $("nWeak").textContent = weak; $("bWeak").disabled = !weak;
  const due = Q.filter(isDue).length;
  $("nDue").textContent = due + "問"; $("bDue").disabled = !due;
  $("snd").textContent = S.sound ? "♪" : "–";
  /* 分野の並び：8つまでは4列×2段、それより多いと3段（9つ＝3×3） */
  const cols = CATS.length > 8 ? Math.ceil(CATS.length / 3) : 4;
  $("cats").style.gridTemplateColumns = "repeat(" + cols + ",1fr)";
  $("cats").style.gridTemplateRows = "repeat(" + Math.ceil(CATS.length / cols) + ",1fr)";
  $("cats").innerHTML = CATS.map((c, i) => {
    const qs = Q.filter(q => q.c === c.id), d = qs.filter(isDone).length, du = qs.filter(isDue).length;
    return '<button class="cat" data-c="' + c.id + '" style="--c:' + (COLORS[c.id] || SPARE[i % SPARE.length]) + '"><h3>' + esc(c.name).replace(/・/g, "・<wbr>") + "</h3>" +
      (d === qs.length ? '<div class="sumi">済</div>' : "") + (du ? '<div class="due num">復習' + du + "</div>" : "") +
      '<div class="n num"><b>' + d + "</b> / " + qs.length + '</div><div class="bar"><i style="width:' + (d / qs.length * 100) + '%"></i></div></button>';
  }).join("");
  show("home");
}
/* 出題の順：未回答 → 前回まちがえた → 前回正解。同じ組の中は毎回ランダム。30分以内に解いた問題は一番後ろ */
const RECENT = 30 * 60 * 1000;
function order(list) {
  const now = Date.now();
  return list.map(q => {
    const h = S.h[q.id];
    const g = !h ? 0 : (h.lastOk ? 2 : 1) + (now - h.last < RECENT ? 3 : 0);
    return { q, g, r: Math.random() };
  }).sort((a, b) => a.g - b.g || a.r - b.r).map(x => x.q);
}
$("cats").addEventListener("click", e => {
  const b = e.target.closest(".cat"); if (!b) return;
  const c = CATS.find(x => x.id === b.dataset.c);
  start(order(Q.filter(q => q.c === c.id)), c.name);
});
$("bDue").onclick = () => start(dueList(), "今日の復習");
$("bRand").onclick = () => start(shuffle(order(Q).slice(0, 10)), "おまかせ");
$("bWeak").onclick = () => start(shuffle(Q.filter(isWeak)).slice(0, 10), "苦手");
$("snd").onclick = () => { S.sound = !S.sound; save(); renderHome(); sTap(); };
$("bList").onclick = () => { sTap(); renderList(); };

/* ---- 問題一覧：分野・状態で絞り、分野順かまちがいの多い順に並べる。行＝その1問、下のボタン＝表示中（20問まで） ---- */
const LMAX = 20;
function listItems() {
  const L = S.list;
  const st = q => { const h = S.h[q.id]; return !h || !h.n ? "new" : h.lastOk ? "ok" : "ng"; };
  let qs = Q.filter(q => (!L.cat || q.c === L.cat) && (L.tab === "all" || st(q) === L.tab));
  if (L.sort === "ng") {
    const miss = q => { const h = S.h[q.id]; return h ? (h.n || 0) - (h.ok || 0) : 0; };
    qs = qs.map((q, i) => ({ q, i, m: miss(q) })).sort((a, b) => b.m - a.m || a.i - b.i).map(x => x.q);
  }
  return qs;
}
function renderList() {
  const L = S.list, catName = id => (CATS.find(c => c.id === id) || {}).name || "";
  $("lCats").innerHTML = [{ id: "", name: "全分野" }].concat(CATS).map(c =>
    '<button class="lc' + (L.cat === c.id ? " on" : "") + '" data-c="' + c.id + '" style="--c:' + (c.id ? COLORS[c.id] || "var(--ink)" : "var(--ink)") + '">' + esc(c.name) + "</button>").join("");
  for (const b of $("lTabs").children) b.classList.toggle("on", b.dataset.t === L.tab);
  $("lSort").textContent = L.sort === "ng" ? "まちがいの多い順" : "分野順";
  const qs = listItems();
  $("lList").innerHTML = qs.length ? qs.map(q => '<button class="li" data-q="' + q.id + '"><small>' + esc(catName(q.c)) + "</small><span>" + esc(q.t) + "</span>" + marks(S.h[q.id]) + "</button>").join("")
    : '<div class="lempty">該当する問題はありません</div>';
  $("lN").textContent = qs.length + "問";
  $("bLGo").textContent = qs.length > LMAX ? "表示中の" + LMAX + "問を解く" : "表示中の" + qs.length + "問を解く";
  $("bLGo").disabled = !qs.length;
  show("list");
}
function listName() { const L = S.list; return L.cat ? CATS.find(c => c.id === L.cat).name : "一覧"; }
$("lCats").addEventListener("click", e => { const b = e.target.closest(".lc"); if (!b) return; S.list.cat = b.dataset.c; save(); sTap(); renderList(); $("lList").scrollTop = 0; });
$("lTabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.list.tab = b.dataset.t; save(); sTap(); renderList(); $("lList").scrollTop = 0; });
$("lSort").onclick = () => { S.list.sort = S.list.sort === "ng" ? "cat" : "ng"; save(); sTap(); renderList(); $("lList").scrollTop = 0; };
$("lList").addEventListener("click", e => { const b = e.target.closest(".li"); if (!b) return; start([Q.find(q => q.id === b.dataset.q)], listName(), "list"); });
$("bLGo").onclick = () => { const qs = listItems(); start((S.list.sort === "ng" ? qs : order(qs)).slice(0, LMAX), listName(), "list"); };
$("bLBack").onclick = () => { sTap(); renderHome(); };

/* ---- 出題 ---- */
let P = null, timer = null;
function start(list, name, from) {
  if (!list.length) return;
  sTap();
  P = { list, name, i: 0, res: [], combo: 0, from: from || "home" };
  show("play");
  nextQ();
}
function blank() { return Array.from({ length: ROWS }, () => ({ a: "", v: "" })); }
function nextQ() {
  const q = P.list[P.i];
  P.rows = { d: blank(), k: blank() };
  P.act = { s: "d", r: 0, f: "a" };
  P.graded = false; P.showEx = false; P.t0 = Date.now(); P.sec = 0; P.tShow = Date.now();
  P.chips = shuffle([...new Set([...q.d, ...q.k].map(x => x[0]).concat(q.x || []))]);
  $("pCat").textContent = P.name;
  $("dots").innerHTML = P.list.map((_, i) => '<i class="' + (i < P.res.length ? (P.res[i].ok ? "ok" : "ng") : i === P.i ? "cur" : "") + '"></i>').join("");
  $("bFlip").hidden = true;
  $("bCheck").textContent = "答え合わせ";
  renderQ(); buildJournal(); renderPanel(); tick();
  clearInterval(timer); timer = setInterval(tick, 1000);
}
function tick() {
  if (!P || P.graded) return;
  P.sec = Math.floor((Date.now() - P.t0) / 1000);
  $("pTime").textContent = Math.floor(P.sec / 60) + ":" + String(P.sec % 60).padStart(2, "0");
}
function renderQ() {
  const q = P.list[P.i], el = $("qin");
  if (!P.showEx) {
    el.className = "qin";
    el.innerHTML = marks(S.h[q.id]) + '<span class="no">第' + (P.i + 1) + "問</span>" + esc(q.q);
  } else {
    let rows = "";
    for (let i = 0; i < Math.max(q.d.length, q.k.length); i++) {
      const d = q.d[i], k = q.k[i];
      rows += "<tr><td>" + (d ? esc(d[0]) : "") + '</td><td class="v num">' + (d ? fmt(d[1]) : "") + '</td><td class="m">' + (k ? esc(k[0]) : "") + '</td><td class="v num">' + (k ? fmt(k[1]) : "") + "</td></tr>";
    }
    el.className = "qin ex";
    el.innerHTML = "<h4>" + esc(q.t) + "</h4><table>" + rows + "</table><p>" + esc(q.e) + "</p>";
  }
  el.scrollTop = 0;
  $("bFlip").textContent = P.showEx ? "問題文" : "解説";
}
function buildJournal() {
  let h = '<div class="jh">借方</div><div class="jh">貸方</div>';
  for (let r = 0; r < ROWS; r++) for (const s of ["d", "k"]) for (const f of ["a", "v"])
    h += '<button class="c ' + s + " " + f + (f === "v" ? " num" : "") + '" data-s="' + s + '" data-r="' + r + '" data-f="' + f + '"></button>';
  h += '<div class="jt"><span>合計</span><b class="num" id="td"></b></div><div class="jt k"><span>合計</span><b class="num" id="tk"></b></div>';
  $("jr").innerHTML = h;
  renderJournal();
}
/* ---- 電卓：金額の欄に式を入れられる（× ÷ が先）。式は文字のまま持ち、= か欄を離れたときに答えにする ---- */
const OPS = "+-*/";
const hasOp = v => /[+\-*/]/.test(v);
function calc(s) {
  const t = String(s).match(/\d+(?:\.\d*)?|\.\d+|[+\-*/]/g);
  if (!t) return NaN;
  while (t.length && OPS.includes(t[t.length - 1])) t.pop();
  if (!t.length || OPS.includes(t[0])) return NaN;
  let total = 0, sign = 1, cur = Number(t[0]);
  for (let i = 1; i < t.length; i += 2) {
    const op = t[i], n = Number(t[i + 1]);
    if (op === "*") cur *= n;
    else if (op === "/") cur = n ? cur / n : NaN;
    else { total += sign * cur; sign = op === "-" ? -1 : 1; cur = n; }
  }
  return Math.round((total + sign * cur) * 1e6) / 1e6;
}
function amt(v) { const x = calc(v); return isFinite(x) ? x : 0; }
function fmtNum(s) { const [i, d] = String(s).split("."); return (i ? Number(i).toLocaleString("ja-JP") : "0") + (d !== undefined ? "." + d : ""); }
function fmtExpr(v) { return v.replace(/\d+(?:\.\d*)?|\.\d+/g, fmtNum).replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−"); }
function cellText(v) { return !v ? "" : hasOp(v) ? fmtExpr(v) : fmtNum(v); }
function finalize() {
  for (const s of ["d", "k"]) for (const row of P.rows[s]) if (hasOp(row.v)) { const x = calc(row.v); if (isFinite(x) && x >= 0) row.v = String(x); }
}

function sum(side) { return P.rows[side].reduce((t, r) => t + amt(r.v), 0); }
function renderJournal() {
  for (const el of $("jr").querySelectorAll(".c")) {
    const { s, r, f } = el.dataset, row = P.rows[s][r];
    el.textContent = f === "a" ? row.a : cellText(row.v);
    el.classList.toggle("long", f === "a" && row.a.length > 9);
    el.classList.toggle("ex", f === "v" && hasOp(row.v));
    el.classList.toggle("act", !P.graded && P.act.s === s && P.act.r == r && P.act.f === f);
  }
  if (!P.graded && P.act.f === "v") {
    const v = P.rows[P.act.s][P.act.r].v, x = calc(v);
    $("dE").textContent = hasOp(v) ? fmtExpr(v) : "";
    $("dR").textContent = !v ? "0" : hasOp(v) ? (isFinite(x) ? "= " + fmtNum(String(x)) : "") : fmtNum(v);
  }
  const d = sum("d"), k = sum("k");
  $("td").textContent = d ? fmt(d) : ""; $("tk").textContent = k ? fmt(k) : "";
  $("jr").classList.toggle("bal", d > 0 && d === k);
  $("bCheck").disabled = !P.graded && !(complete("d") && complete("k"));
}
function complete(side) { return P.rows[side].some(r => r.a && amt(r.v) > 0); }
function renderPanel() {
  $("pvChips").hidden = P.graded || P.act.f !== "a";
  $("pvPad").hidden = P.graded || P.act.f !== "v";
  $("pvRes").hidden = !P.graded;
  if (P.graded) return;
  if (P.act.f === "a") {
    const used = new Set(P.rows.d.concat(P.rows.k).map(r => r.a));
    $("chips").innerHTML = P.chips.map(a => '<button class="chip' + (a.length > 8 ? " long" : "") + (used.has(a) ? " used" : "") + '">' + esc(a) + "</button>").join("");
  }
}
$("pad").innerHTML = [["7"], ["8"], ["9"], ["/", "÷", "op"], ["4"], ["5"], ["6"], ["*", "×", "op"], ["1"], ["2"], ["3"], ["-", "−", "op"],
  ["0"], ["00"], ["000"], ["+", "+", "op"], ["c", "C", "s"], ["bs", "⌫", "s"], ["."], ["=", "=", "eq"]]
  .map(([k, l, c]) => '<button class="key num ' + (c || "") + '" data-k="' + k + '">' + (l || k) + "</button>").join("");

$("jr").addEventListener("click", e => {
  const el = e.target.closest(".c"); if (!el || P.graded) return;
  finalize();
  P.act = { s: el.dataset.s, r: +el.dataset.r, f: el.dataset.f };
  sTap(); renderJournal(); renderPanel();
});
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b || P.graded) return;
  const row = P.rows[P.act.s][P.act.r];
  row.a = b.textContent; P.act.f = "v";
  sTap(); renderJournal(); renderPanel();
});
$("bDel").onclick = () => {
  const row = P.rows[P.act.s][P.act.r]; row.a = ""; row.v = "";
  sTap(); renderJournal(); renderPanel();
};
$("pad").addEventListener("click", e => {
  const b = e.target.closest(".key"); if (!b || P.graded) return;
  const k = b.dataset.k, row = P.rows[P.act.s][P.act.r], v = row.v;
  const tok = (v.match(/[\d.]*$/) || [""])[0], last = v.slice(-1);
  if (k === "bs") row.v = v.slice(0, -1);
  else if (k === "c") row.v = "";
  else if (k === "=") { if (hasOp(v)) { const x = calc(v); if (isFinite(x) && x >= 0) row.v = String(x); } }
  else if (OPS.includes(k)) { if (v) row.v = (OPS.includes(last) || last === "." ? v.slice(0, -1) : v) + k; }
  else if (k === ".") { if (!tok.includes(".")) row.v = v + (tok === "" ? "0." : "."); }
  else if (tok === "0") { if (k.length === 1 && k !== "0") row.v = v.slice(0, -1) + k; }   // 先頭の0の後ろに数字は続けない
  else if (!(tok === "" && k.length > 1)) row.v = v + k;                                    // 00・000 は数の頭に置かない
  if (row.v.length > 24) row.v = v;
  sTap(); renderJournal(); renderPanel();
});

/* ---- 採点：同じ側の同じ科目は合算してから比べる（行の順番は問わない） ---- */
function tally(pairs) { const m = {}; for (const [a, v] of pairs) m[a] = (m[a] || 0) + Number(v); return m; }
function grade() {
  const q = P.list[P.i]; let all = true;
  for (const s of ["d", "k"]) {
    const ans = tally(q[s]), rows = P.rows[s];
    const mine = tally(rows.filter(r => r.a && amt(r.v) > 0).map(r => [r.a, amt(r.v)]));
    rows.forEach((row, r) => {
      if (!row.a && !row.v) return;
      const ok = !!row.a && amt(row.v) > 0 && ans[row.a] === mine[row.a];
      if (!ok) all = false;
      $("jr").querySelector('.c.a[data-s="' + s + '"][data-r="' + r + '"]').classList.add(ok ? "ok" : "ng");
    });
    if (Object.keys(ans).length !== Object.keys(mine).length) all = false;
  }
  return all;
}
$("bCheck").onclick = () => {
  if (!P.graded) {
    finalize();
    P.graded = true; clearInterval(timer);
    renderJournal();
    const ok = grade(), q = P.list[P.i];
    P.res.push({ q, ok, sec: P.sec });
    P.combo = ok ? P.combo + 1 : 0;
    const h = S.h[q.id] || (S.h[q.id] = { n: 0, ok: 0 });
    const now = Date.now();
    schedule(h, ok, now);
    h.hist = (histOf(h) + (ok ? "o" : "x")).slice(-10);
    h.n++; if (ok) h.ok++; h.last = now; h.lastOk = ok;
    S.days[today()] = (S.days[today()] || 0) + 1; save();
    ok ? sOk() : sNg();
    $("res").innerHTML = '<div class="han' + (ok ? "" : " ng") + '">' + (ok ? "正解" : "不正解") + "</div>" +
      (ok && P.combo >= 2 ? '<div class="combo">' + P.combo + "連続</div>" : "") + '<div class="sec num">' + P.sec + "秒</div>";
    $("dots").children[P.i].className = ok ? "ok" : "ng";
    P.showEx = true; renderQ(); $("bFlip").hidden = false;
    $("bCheck").textContent = P.i + 1 < P.list.length ? "次の問題" : "結果を見る";
    renderPanel();
  } else {
    sTap(); addTime();
    if (++P.i < P.list.length) nextQ(); else renderResult();
  }
};
$("bFlip").onclick = () => { P.showEx = !P.showEx; renderQ(); };
function backTo() { P.from === "list" ? renderList() : renderHome(); }
$("bBack").onclick = () => { clearInterval(timer); addTime(); P.res.length ? renderResult() : backTo(); };

/* ---- 結果 ---- */
function renderResult() {
  clearInterval(timer);
  const n = P.res.length, ok = P.res.filter(r => r.ok).length, rate = n ? ok / n : 0;
  $("rDan").textContent = rate === 1 ? "免許皆伝" : rate >= .8 ? "師範代" : rate >= .6 ? "有段者" : "稽古中";
  $("rSc").innerHTML = ok + "<span> / " + n + "</span>";
  const t = P.res.reduce((s, r) => s + r.sec, 0);
  $("rTime").textContent = Math.floor(t / 60) + "分" + (t % 60) + "秒";
  $("rList").innerHTML = P.res.map(r => '<div class="li"><b class="' + (r.ok ? "ok" : "ng") + '">' + (r.ok ? "○" : "×") + "</b><span>" + esc(r.q.t) + '</span><small class="num">' + r.sec + "秒</small></div>").join("");
  $("bRetry").disabled = ok === n;
  $("bHome").textContent = P.from === "list" ? "一覧へ戻る" : "道場へ戻る";
  show("result");
  if (rate === 1) sOk();
}
$("bHome").onclick = () => { sTap(); backTo(); };
$("bRetry").onclick = () => start(P.res.filter(r => !r.ok).map(r => r.q), "もう一度", P.from);

/* 画面の実寸で stage を合わせる（100dvh は iPhone で実際より短くなり、下に余白が出た） */
function fit() {
  const r = document.documentElement.style;
  r.setProperty("--W", window.innerWidth + "px"); r.setProperty("--H", window.innerHeight + "px");
}
fit();
addEventListener("resize", fit); addEventListener("orientationchange", () => setTimeout(fit, 300));

renderHome();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
